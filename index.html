<!DOCTYPE html>
<html>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindle Clock</title>
<style type="text/css">
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #ffffff;
  color: #000000;
  font-family: Arial, sans-serif;
  text-align: center;
}
.wrap {
  width: 97%;
  margin: 0 auto;
  padding-top: 28px;
}
#time {
  font-size: 162px;
  line-height: 0.94;
  font-weight: bold;
  margin: 0 0 24px 0;
  letter-spacing: 1px;
}
#date {
  font-size: 46px;
  line-height: 1.16;
  font-weight: bold;
  margin: 0 0 24px 0;
}
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-weight: bold;
}
th {
  border-bottom: 3px solid #000000;
  padding: 16px 0 18px 0;
  font-size: 38px;
  line-height: 1.0;
  font-weight: bold;
}
td {
  height: 104px;
  padding: 0;
  text-align: center;
  vertical-align: middle;
  font-weight: bold;
}
.solar {
  display: block;
  font-size: 46px;
  line-height: 1.0;
  font-weight: bold;
  margin: 0 0 10px 0;
}
.lunar {
  display: block;
  font-size: 23px;
  line-height: 1.0;
  font-weight: normal;
  white-space: nowrap;
  margin: 0;
}
.today {
  background: #000000;
  color: #ffffff;
}
.today .solar,
.today .lunar {
  color: #ffffff;
}
.line {
  border-top: 3px solid #000000;
  margin: 22px 0 0 0;
}
#quoteSpacer {
  height: 42px;
}
#quote {
  font-size: 46px;
  line-height: 1.25;
  font-weight: bold;
  margin: 0 14px 24px 14px;
}
</style>
</head>

<body>
<div class="wrap">
  <div id="time">--:--</div>
  <div id="date">正在读取北京时间…</div>

  <table>
    <tr>
      <th>日</th><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th>
    </tr>
    <tbody id="calendar"></tbody>
  </table>

  <div class="line"></div>
  <div id="quoteSpacer"></div>
  <div id="quote"></div>
</div>

<script type="text/javascript">

"少看噪音，多看事实。",

"先行动，再调整。",
"每天前进一点点。"

var weekCN = ["日","一","二","三","四","五","六"];

var lunarInfo = [

0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,

0x0d520
];

var lunarMonths = ["正月","二月","三月","四月","五月","六月","七月","八月","九月","十月","冬月","腊月"];
var lunarDays = [
"初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
"十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",
"廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"
];

function pad(n) {
  if (n < 10) return "0" + n;
  return "" + n;
}

function getBeijingNow() {
  var now = new Date();
  var utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 8 * 3600000);
}

function leapMonth(y) {
  return lunarInfo[y - 1900] & 0xf;
}

function leapDays(y) {
  if (leapMonth(y)) {
    return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
  }
  return 0;
}

function monthDays(y, m) {
  return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}

function lunarYearDays(y) {
  var sum = 348;
  var i;
  for (i = 0x8000; i > 0x8; i = i >> 1) {
    if (lunarInfo[y - 1900] & i) sum++;
  }
  return sum + leapDays(y);
}

function solarToLunar(y, m, d) {
  var offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
  var ly = 1900;
  var lm = 1;
  var leap;
  var isLeap = false;
  var md;

  while (ly < 2101 && offset >= lunarYearDays(ly)) {
    offset -= lunarYearDays(ly);
    ly++;
  }

  leap = leapMonth(ly);

  while (lm <= 12) {
    if (leap && lm == leap + 1 && !isLeap) {
      lm--;
      isLeap = true;
      md = leapDays(ly);
    } else {
      md = monthDays(ly, lm);
    }

    if (offset < md) break;

    offset -= md;

    if (isLeap && lm == leap) {
      isLeap = false;
    }

    lm++;
  }

  return {
    year: ly,
    month: lm,
    day: offset + 1,
    isLeap: isLeap
  };
}

function lunarShortText(y, m, d) {
  var l = solarToLunar(y, m, d);
  if (l.day == 1) {
    return (l.isLeap ? "闰" : "") + lunarMonths[l.month - 1];
  }
  return lunarDays[l.day - 1];
}

function renderCalendar(y, m, today) {
  var firstDay = new Date(y, m - 1, 1).getDay();
  var days = new Date(y, m, 0).getDate();
  var totalCells = firstDay + days;
  var rowsNeeded = Math.ceil(totalCells / 7);
  var html = "";
  var d = 1;
  var row, col;
  var lunarText;
  var allCells;

  for (row = 0; row < rowsNeeded; row++) {
    html += "<tr>";
    for (col = 0; col < 7; col++) {
      if ((row === 0 && col < firstDay) || d > days) {
        html += "<td>&nbsp;</td>";
      } else {
        lunarText = lunarShortText(y, m, d);
        if (d === today) {
          html += '<td class="today"><span class="solar">' + d + '</span><span class="lunar">' + lunarText + '</span></td>';
        } else {
          html += '<td><span class="solar">' + d + '</span><span class="lunar">' + lunarText + '</span></td>';
        }
        d++;
      }
    }
    html += "</tr>";
  }

  document.getElementById("calendar").innerHTML = html;

  allCells = document.getElementById("calendar").getElementsByTagName("td");

  /* 第一行额外向下留白，让第一行与上横线的距离更接近最后一行与下横线的距离。 */
  for (col = 0; col < 7 && col < allCells.length; col++) {
    allCells[col].style.paddingTop = "20px";
  }

  /* 五行月份尽量把月历做成主体；六行月份自动略压缩，避免超屏。 */
  if (rowsNeeded >= 6) {
    for (row = 0; row < allCells.length; row++) {
      allCells[row].style.height = "88px";
    }
    for (col = 0; col < 7 && col < allCells.length; col++) {
      allCells[col].style.height = "104px";
    }
    document.getElementById("quoteSpacer").style.height = "42px";
    document.getElementById("quote").style.fontSize = "42px";
  } else {
    for (row = 0; row < allCells.length; row++) {
      allCells[row].style.height = "104px";
    }
    for (col = 0; col < 7 && col < allCells.length; col++) {
      allCells[col].style.height = "124px";
    }
    document.getElementById("quoteSpacer").style.height = "78px";
    document.getElementById("quote").style.fontSize = "46px";
  }
}

function updateClock() {
  var d = getBeijingNow();
  var y = d.getFullYear();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  var hour = d.getHours();
  var minute = d.getMinutes();

  document.getElementById("time").innerHTML = pad(hour) + ":" + pad(minute);
  document.getElementById("date").innerHTML =
    y + "年" + m + "月" + day + "日　星期" + weekCN[d.getDay()];
  document.getElementById("quote").innerHTML =
    "「" + quotes[(day - 1) % quotes.length] + "」";

  renderCalendar(y, m, day);
}

updateClock();
window.setInterval(updateClock, 60000);
